server:
  port: 8081                      # 8080 is taken by another local service on the dev machine

spring:
  application.name: gate-service
  # Local secrets (KEK password) live in the gitignored data/ folder. Env var GATE_KEK_PASSWORD also works.
  config.import: optional:file:../data/local-secrets.properties
  datasource:
    url: jdbc:postgresql://localhost:5433/gate
    username: poc
    password: poc                 # local docker-compose toy credentials
  jpa:
    open-in-view: false           # no lazy DB access from controllers: the DB work ends inside the service
    hibernate.ddl-auto: validate  # Flyway owns the schema; Hibernate only checks the entities match it
  servlet.multipart:
    max-file-size: 5MB
    max-request-size: 6MB

management:
  endpoints.web.exposure.include: health,prometheus,circuitbreakers,circuitbreakerevents
  health.circuitbreakers.enabled: true

# Circuit breakers (Resilience4j). Counting window of the last 10 calls; from 5 calls on, >= 50% failed or slow
# opens the breaker. OPEN = reject instantly (MANUAL without waiting) for 10 s, then HALF_OPEN lets 2 trial calls
# through: both succeed -> CLOSED, otherwise OPEN again.
resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      slow-call-duration-threshold: 300ms
      slow-call-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 2
      register-health-indicator: true
      event-consumer-buffer-size: 50       # recent events for /actuator/circuitbreakerevents (console timeline)
  instances:
    identity:
      base-config: default
    model:
      base-config: default
      slow-call-duration-threshold: 800ms   # the model-service read timeout (GPU)

gate:
  model-service:
    url: http://localhost:8001
    connect-timeout: 100ms
    read-timeout: 800ms           # GPU; use 1500ms for CPU
  identity:                       # mock-idp (identity provider stand-in)
    url: http://localhost:8002
    connect-timeout: 100ms
    read-timeout: 300ms
  dcs:                            # dcs-stub (manifest)
    url: http://localhost:8002
    connect-timeout: 100ms
    read-timeout: 2s
  policy:
    # ILLUSTRATIVE, not calibrated. Brackets keep "_" and "-" in map keys.
    # R50: 0.44 = highest impostor top-1 seen (0.413) + 0.02 gap, from tools/score_analysis.py on a 49-identity,
    # mostly synthetic gallery (docs/score-analysis.md). The placeholder 0.35 let 13 of 100 impostors through.
    # SFace: OpenCV Zoo default, not analysed here.
    thresholds:
      "[r50-buffalo_l]": 0.44
      "[sface-2021dec]": 0.363
    margin: 0.10
  kek:
    path: ../data/kek.p12         # PKCS12 keystore, a stand-in for a KMS/HSM
    password: ${GATE_KEK_PASSWORD:}
  retention:
    grace: 2m                     # after departure, before templates are crypto-shredded (short for the demo)
    purge-interval: 30s

demo:
  xray: false                     # DEMO ONLY: X-ray endpoints + per-candidate scores (see application-demo.yml)
  synthetic-id-prefix: S          # profile ids starting with this are synthetic (DigiFace) passengers
